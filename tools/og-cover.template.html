<!--
  Source for assets/img/og-cover.jpg (the 1200x630 social preview).

  To regenerate after a data or branding change:
    1. npm start   (or: PORT=5177 npm start — the URLs below assume 5177)
    2. open http://127.0.0.1:5177/tools/og-cover.template.html
    3. screenshot the 1200x630 viewport to assets/img/og-cover.jpg

  Teacher first: the preview is what people see when the link is shared in a
  WhatsApp group, so it leads with his face, name and title.
  The numbers below are copied from data/build-report.json — keep them in sync.
-->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Plex AR";
        src: url("http://127.0.0.1:5177/assets/fonts/plex-ar-700.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Plex AR";
        src: url("http://127.0.0.1:5177/assets/fonts/plex-ar-500.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "Plex AR";
        src: url("http://127.0.0.1:5177/assets/fonts/plex-ar-400.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Plex AR";
        src: url("http://127.0.0.1:5177/assets/fonts/plex-lat-700.woff2") format("woff2");
        font-weight: 700;
        unicode-range: U+0000-00FF;
      }
      * { margin: 0; box-sizing: border-box; }
      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 0 80px;
        background: #f2f0e9;
        background-image:
          radial-gradient(72% 90% at 100% 0%, rgba(200, 155, 72, 0.26), transparent 62%),
          radial-gradient(60% 80% at 0% 100%, rgba(15, 39, 67, 0.1), transparent 65%);
        color: #0f2743;
        font-family: "Plex AR", "Segoe UI", sans-serif;
      }
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(15, 39, 67, 0.09) 1.3px, transparent 1.6px);
        background-size: 26px 26px;
        -webkit-mask-image: radial-gradient(45% 75% at 20% 50%, #000, transparent 75%);
        mask-image: radial-gradient(45% 75% at 20% 50%, #000, transparent 75%);
      }
      .rule {
        position: absolute;
        inset-block-start: 0;
        inset-inline: 0;
        height: 8px;
        background: linear-gradient(90deg, #0f2743, #a8752a 45%, #d9b165);
      }
      .copy { position: relative; flex: 1 1 auto; min-width: 0; }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 8px 20px;
        margin-block-end: 22px;
        background: #fffdf8;
        border: 1px solid #e3dfd3;
        border-radius: 999px;
        font-size: 22px;
        font-weight: 500;
        color: #4a5a72;
      }
      .eyebrow::before {
        content: "";
        width: 10px; height: 10px; border-radius: 50%; background: #a8752a;
        box-shadow: 0 0 0 4px #f7efe0;
      }
      h1 { font-size: 70px; line-height: 1.15; letter-spacing: -0.015em; font-weight: 700; }
      .role {
        display: inline-block;
        margin-block-start: 10px;
        font-size: 40px;
        font-weight: 700;
        color: #143a63;
        background-image: linear-gradient(rgba(200, 155, 72, 0.38), rgba(200, 155, 72, 0.38));
        background-repeat: no-repeat;
        background-size: 100% 0.3em;
        background-position: 0 86%;
      }
      .facts { margin-block-start: 22px; display: grid; gap: 8px; }
      .facts p { font-size: 24px; line-height: 1.45; color: #4a5a72; font-weight: 500; }
      .facts b { color: #0f2743; font-weight: 700; }
      .contact {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-block-start: 26px;
        padding: 10px 22px;
        background: #0f7a45;
        color: #fff;
        border-radius: 999px;
        font-size: 24px;
        font-weight: 700;
      }
      .contact svg { width: 28px; height: 28px; fill: #fff; }
      .contact bdi { letter-spacing: 0.02em; }

      .brand { position: relative; flex: none; padding-block-end: 24px; }
      .seal {
        position: relative;
        width: 360px;
        height: 360px;
        padding: 11px;
        border-radius: 50%;
        background: linear-gradient(150deg, #fffdf8 25%, #efe5d1);
        box-shadow: 0 34px 64px -30px rgba(15, 39, 67, 0.45), 0 10px 22px -14px rgba(168, 117, 42, 0.3);
      }
      .seal::before, .seal::after { content: ""; position: absolute; border-radius: 50%; }
      .seal::before { inset: -22px; border: 2px dashed rgba(168, 117, 42, 0.36); }
      .seal::after { inset: -44px; border: 1px solid rgba(168, 117, 42, 0.18); }
      .seal img.photo {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 0 0 1px rgba(168, 117, 42, 0.32);
      }
      .badge {
        position: absolute;
        z-index: 1;
        inset-block-end: 26px;
        inset-inline-end: -8px;
        width: 92px;
        height: 92px;
        border-radius: 50%;
        background: #fffdf8;
        box-shadow: 0 0 0 4px #f2f0e9, 0 0 0 5px rgba(168, 117, 42, 0.32), 0 8px 20px -10px rgba(15, 39, 67, 0.4);
      }
      .caption {
        position: absolute;
        inset-block-end: 0;
        inset-inline-start: 50%;
        transform: translateX(50%);
        padding: 9px 22px;
        background: #fffdf8;
        border: 1px solid #e3dfd3;
        border-radius: 999px;
        box-shadow: 0 8px 20px -10px rgba(15, 39, 67, 0.3);
        font-size: 22px;
        font-weight: 700;
        white-space: nowrap;
      }
      .caption span { font-weight: 500; color: #7a5214; }
    </style>
  </head>
  <body>
    <div class="rule"></div>
    <div class="copy">
      <span class="eyebrow">المتميز في القدرات الكمي · الجزء الثاني</span>
      <h1>الأستاذ محمد أسامه</h1>
      <span class="role">مدرب القدرات الكمي</span>
      <div class="facts">
        <p>صاحب مذكرات <b>«المتميز في القدرات الكمي»</b></p>
        <p>الجزء الثاني — التجميعات — مجانًا وبلا تسجيل</p>
        <p><b>42</b> إصدارًا إلكترونيًا · <b>1984</b> سؤالًا</p>
      </div>
      <span class="contact">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
        <span>واتساب</span>
        <bdi dir="ltr">+966 56 717 3752</bdi>
      </span>
    </div>
    <div class="brand">
      <div class="seal">
        <img class="photo" src="http://127.0.0.1:5177/assets/img/teacher-portrait-720.webp" alt="" />
      </div>
      <img class="badge" src="http://127.0.0.1:5177/assets/img/mark-144.webp" alt="" />
      <p class="caption"><span>الأستاذ /</span> محمد أسامه حرحيره</p>
    </div>
  </body>
</html>
